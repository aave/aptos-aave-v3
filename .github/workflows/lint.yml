name: lint

on:
  pull_request:
  merge_group:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: true
  CI: true
  GITHUB_ACTIONS: true
  APTOS_NETWORK: local
  MOVE_VERSION: 2.1
  COMPILER_VERSION: 2.0
  ARTIFACTS_LEVEL: all
  AAVE_LARGE_PACKAGES_PRIVATE_KEY: ${{ secrets.GH_AAVE_LARGE_PACKAGES_PRIVATE_KEY }}  # temp hack: remove after large packages is no longer needed

jobs:

  pre-commit:
    name: Pre-commit
    runs-on: Larger-Github-Runners
    steps:
      - uses: actions/checkout@v4

      - name: Check workflow files
        uses: docker://rhysd/actionlint:latest
        env:
          SHELLCHECK_OPTS: --exclude=SC2086,SC2129,SC2046
        with:
          args: -color

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y

      - name: Install Aptos CLI (script)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://aptos.dev/scripts/install_cli.sh" | sh
          echo "$HOME/.aptos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Aptos
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.aptos/bin:$HOME/.local/bin:$PATH"
          aptos --version
          aptos update movefmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5

      - name: Run Pre Commit
        uses: pre-commit/action@v3.0.1
        env:
          SKIP: detect-secrets  # skip only this hook in CI; still runs locally

  fmt:
    name: fmt
    runs-on: Larger-Github-Runners
    env:
      RUST_BACKTRACE: 1
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y

      - name: Install Aptos CLI (script)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://aptos.dev/scripts/install_cli.sh" | sh
          echo "$HOME/.aptos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Aptos
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.aptos/bin:$HOME/.local/bin:$PATH"
          aptos --version
          aptos update movefmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fmt Project
        run: make fmt

  codespell:
    runs-on: Larger-Github-Runners
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: codespell-project/actions-codespell@v2
        with:
          skip: "*.json"

  lint:
    name: lint
    needs:
      - codespell
    runs-on: Larger-Github-Runners
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y

      - name: Install Aptos CLI (script)
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL "https://aptos.dev/scripts/install_cli.sh" | sh
          echo "$HOME/.aptos/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Aptos
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.aptos/bin:$HOME/.local/bin:$PATH"
          aptos --version
          aptos update movefmt

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Python
        uses: actions/setup-python@v5

      - name: Lint project
        run: make lint
